[project]
name = "agent-ecg"
version = "0.1.0"
description = "European Camping Group (ECG) Multi-Agent System built with Google ADK"
readme = "spec.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "google-adk",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-aiplatform>=1.161.0",
    "google-cloud-firestore>=2.15.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
